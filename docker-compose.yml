services:
  bot:
    build: .
    container_name: zephyr-bot
    env_file: .env
    # Main configuration block. 
    # You can override any of these in your .env file using the ZEPHYR_ prefix.
    command: >
      ${ZEPHYR_DRY_RUN_FLAG:---dry-run}
      --symbols ${ZEPHYR_SYMBOLS:-SOL/USD}
      --trade-amount-usd ${ZEPHYR_TRADE_AMOUNT:-100}
      --maker-base-spread-pct ${ZEPHYR_BASE_SPREAD:-0.5}
      --inventory-risk-aversion ${ZEPHYR_RISK_AVERSION:-0.1}
      --order-refresh-tolerance-pct ${ZEPHYR_REFRESH_TOLERANCE:-0.05}
      --dry-run-balance-usd ${ZEPHYR_DRY_RUN_BALANCE:-10000.0}
      --log-level ${ZEPHYR_LOG_LEVEL:-INFO}
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    # Persistent storage for your trades.csv
    volumes:
      - ./data:/app/data

    # Resource limits to ensure stability on low-memory instances
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
